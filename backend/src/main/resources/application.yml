spring:
  application:
    name: streakforge
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/streakforge}
    username: ${DATABASE_USERNAME:streakforge}
    password: ${DATABASE_PASSWORD:streakforge}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      initialization-fail-timeout: 60000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true
    clean-disabled: false

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:14}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,https://*.github.io,https://*.onrender.com,https://*.vercel.app}
