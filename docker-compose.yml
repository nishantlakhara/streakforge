services:
  postgres:
    image: postgres:16-alpine
    container_name: streakforge-postgres
    environment:
      POSTGRES_DB: streakforge
      POSTGRES_USER: streakforge
      POSTGRES_PASSWORD: streakforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streakforge -d streakforge"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

